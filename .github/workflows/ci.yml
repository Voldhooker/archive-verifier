name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - run: dotnet restore Archive.Verifier.slnx -p:ContinuousIntegrationBuild=true
      - run: dotnet build Archive.Verifier.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
      - run: dotnet test Archive.Verifier.slnx --no-build --configuration Release
